<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>허들링 클럽 v2 · 검정 모션 미리보기</title><script src="lib/gsap.min.js"></script><script src="lib/CustomEase.min.js"></script><style>body{margin:0;background:#000;color:white;font:16px sans-serif}#viewport{width:100vw;height:56.25vw;overflow:hidden}#film{width:1920px;height:1080px;position:relative;transform-origin:0 0}#controls{display:flex;gap:20px;padding:20px;align-items:center}input{flex:1}button{padding:12px 24px;background:#3759de;color:white;border:0;border-radius:8px}</style></head><body><div id="viewport"><div id="film"></div></div><div id="controls"><button id="play">재생</button><input type="range" id="seek" min="0" max="19.999" step=".001" value="0"><output id="clock">0.00 / 20s</output><span>v2 · 무음 미리보기</span></div><script>
const specs=[["skills", 0, 4], ["mission", 4, 4], ["approval", 8, 4], ["assets", 12, 5], ["end", 17, 3]];window.__timelines={};let playing=false,time=0,last=0;
function fit(){document.querySelector('#film').style.transform='scale('+innerWidth/1920+')'}onresize=fit;fit();
window.ready=(async()=>{for(const [name,start,duration] of specs){const html=await(await fetch('compositions/'+name+'.html')).text();const template=document.createElement('template');template.innerHTML=html;const content=template.content.querySelector('template').content.cloneNode(true);const script=content.querySelector('script');const js=script.textContent;script.remove();const root=content.querySelector('#root');root.id='review-'+name;content.querySelector('style').textContent=content.querySelector('style').textContent.replaceAll('#root','#review-'+name);document.querySelector('#film').append(content);new Function(js)();}await document.fonts.ready;await Promise.all([...document.images].map(im=>im.decode()));seekTo(.8);return true;})();
window.seekTo=function(t){time=Math.max(0,Math.min(19.999,t));for(const [n,s,d] of specs){const el=document.getElementById('review-'+n);el.style.display=(time>=s&&time<s+d)?'block':'none';window.__timelines[n].seek(Math.max(0,Math.min(d,time-s)),false)}document.querySelector('#seek').value=time;document.querySelector('#clock').textContent=time.toFixed(2)+' / 20s';};
document.querySelector('#seek').oninput=e=>{playing=false;seekTo(+e.target.value)};document.querySelector('#play').onclick=()=>{playing=!playing;if(time>=19.99)seekTo(0);document.querySelector('#play').textContent=playing?'일시정지':'재생'};
function tick(now){if(playing){seekTo(time+(now-last)/1000);if(time>=19.99)playing=false}last=now;requestAnimationFrame(tick)}requestAnimationFrame(tick);
</script></body></html>
